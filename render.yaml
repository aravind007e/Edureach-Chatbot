services:
  # 1. Backend Web Service (Node.js + Express)
  - type: web
    name: edureach-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: llama3.2:3b
      - key: OLLAMA_EMBEDDING_MODEL
        value: nomic-embed-text
      - key: RAG_TOP_K
        value: 2
      - key: RAG_MIN_SIMILARITY
        value: 0.40

  # 2. Frontend Static Site (React + Vite)
  - type: web
    name: edureach-frontend
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_VAPI_PUBLIC_KEY
        value: 89c8ac73-dfa6-4d65-bf52-fab22fde2291
      - key: VITE_VAPI_ASSISTANT_ID
        value: 3be188b0-a538-47cc-86a7-e3743e291f32
